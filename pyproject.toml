[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obtopomem"
version = "0.1.0"
description = "Object-Level Change Detection Through Topological Environment Memory"
requires-python = ">=3.11,<3.12"

dependencies = [
    # Machine learning frameworks
    "tensorflow[and-cuda]==2.20.0",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "triton==3.7.1",

    # Numerical computing and computer vision
    "numpy==2.4.6",
    "opencv-python==4.11.0.86",
    "Pillow==13.0.0",
    "matplotlib==3.11.2",

    # Graph processing
    "igraph==0.11.8",
    "leidenalg==0.10.2",
    "bidict==0.23.1",

    # Utilities
    "ffmpeg-python==0.2.0",
    "tqdm==4.70.1",
    "gdown==6.4.2",
]

[tool.setuptools.packages.find]
where = ["src", "third_party/omniglue"]
include = [
    "obtopomem*",
    "third_party",
    "third_party.dinov2*"
]